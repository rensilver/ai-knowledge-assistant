spring:
  autoconfigure:
    # PgVectorConfig defines the `vectorStore` bean itself (pinned to the
    # document_chunks schema/dimensions), which collides with Spring AI's
    # own auto-configured bean of the same name.
    exclude: org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/ai-knowledge-assistant
    username: postgres
    password: postgres
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2:latest
          temperature: 0.3
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      pgvector:
        # not strictly required since we build the bean manually,
        # but harmless to keep for documentation purposes
        index-type: HNSW
        distance-type: COSINE_DISTANCE
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
logging:
  pattern:
    # requestId comes from CorrelationIdFilter's MDC entry; blank outside a
    # request (e.g. startup logs). application-prod.yml replaces this with
    # structured JSON instead, where MDC is included automatically.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n%wEx"
app:
  cors:
    allowed-origins: http://localhost:3000
  jwt:
    # Dev-only default so the app runs out of the box. JwtService Base64-decodes
    # this and requires >= 256 bits (HS256). Override in every real environment:
    #   export JWT_SECRET="$(openssl rand -base64 32)"
    secret: ${JWT_SECRET:Q/BAIPFSqVcGdm0ZAt65WJvx5oigSTrFJuash9NaZm8=}
    expiration-ms: 86400000
  document:
    upload-dir: ./uploads
  rag:
    chunk-size: 800
    # Chunks actually placed in the prompt, after re-ranking.
    top-k: 5
    similarity-threshold: 0.5
    # Candidates pulled from pgvector per query = top-k * overfetch-factor.
    # Higher gives the re-ranker more to choose from, at a larger index scan.
    overfetch-factor: 4
    # Re-rank blend: 1.0 = pure vector similarity, 0.0 = pure keyword overlap.
    vector-weight: 0.75
